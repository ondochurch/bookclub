<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>온도교회 사명자반 북클럽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="alternate" hreflang="en" href="index-en.html">
  <!-- PapaParse CSV 파싱 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- 북클럽 데이터 로더 -->
  <script src="bookclub-data.js?v=4"></script>
</head>
<body>

  <div class="frame">

    <header class="pagehead">
      <div class="pagehead-main">
        <p class="kicker">
          <a class="church-mark" href="https://www.ondochurch.org/" target="_blank">
            <img class="mark mark-light" src="assets/ondo-mark.png" alt="" aria-hidden="true" width="224" height="172">
            <img class="mark mark-dark" src="assets/ondo-mark-dark.png" alt="" aria-hidden="true" width="224" height="172">
            <span class="sr-only">온도교회</span>
          </a>
          함께 읽고, 함께 나누며, 함께 성장하는 공동체
        </p>
        <h1 class="hero-title">온도교회 사명자반 북클럽</h1>
        <p class="lede">온도교회 사명자반 북클럽은 말씀과 독서를 통해 함께 배우고 성장하는 모임입니다.</p>
        <!-- 신청 비활성. 다시 열려면 <a href="register.html" class="btn">신청하기</a> 형태로 되돌린다. -->
        <span class="btn btn-off" aria-disabled="true">2026년 가을학기 신청</span>
      </div>
      <nav class="pagehead-links">
        <a href="index-en.html">English</a>
        <a href="https://www.youtube.com/@ONDOChurch" target="_blank">YouTube</a>
      </nav>
    </header>

    <section class="section">
      <!-- 학기마다 그리드를 따로 두면 4~7권짜리 학기는 오른쪽 절반이 빈다.
           책을 학기 경계 없이 이어 채우고, 학기 표시는 bookclub-data.js가
           카드 줄 위 "레인"에 각 학기 첫 책의 x위치를 맞춰 생성한다.
           아래 template은 학기 순서와 표시 이름만 선언한다 (렌더링 결과 아님). -->
      <div class="shelf-stream">
        <template data-shelf-semester="2026-가을" data-shelf-label="2026년 가을학기"></template>
        <template data-shelf-semester="2026-봄"   data-shelf-label="2026년 봄학기"></template>
        <template data-shelf-semester="2025-가을" data-shelf-label="2025년 가을학기"></template>
        <template data-shelf-semester="2025-봄"   data-shelf-label="2025년 봄학기"></template>
      </div>
    </section>

    <section class="section">
      <h2>둘러보기</h2>

      <div class="feature-grid">
        <a href="summary.html" class="feature-card">
          <span class="label">북클럽 내용 정리</span>
          <span class="desc">지난 북클럽 모임의 토론 내용과 인사이트를 확인하세요.</span>
          <span class="arrow">→</span>
        </a>

        <a href="questions.html" class="feature-card">
          <span class="label">신학 질문</span>
          <span class="desc">궁금한 신학적 질문을 자유롭게 제출하고 함께 답을 찾아가세요.</span>
          <span class="arrow">→</span>
        </a>
      </div>

      <!-- "북클럽 신청"은 위 히어로의 큰 버튼과 같은 곳(register.html)으로 가므로
           목록에서는 뺐다. 되살리려면 히어로 버튼을 함께 정리할 것. -->

      <a href="resources.html" class="index-row">
        <span>
          <span class="label">기타 자료</span>
          <span class="desc">북클럽 활동에 도움이 되는 다양한 학습 자료를 확인하세요.</span>
        </span>
        <span class="arrow">→</span>
      </a>

      <!-- 감춤: 새로운 책 제안. 다시 보이려면 아래 주석을 해제.
      <a href="https://docs.google.com/spreadsheets/d/1Blk7ikG3jJzcUDCgnmClkbPqZo2u6NDg6lX8xCIB_20/edit?gid=0#gid=0" target="_blank" class="index-row">
        <span>
          <span class="label">새로운 책 제안</span>
          <span class="desc">북클럽에서 함께 읽고 싶은 책을 제안해 주세요.</span>
        </span>
        <span class="arrow">→</span>
      </a>
      -->

      <!-- 감춤: 참여자 현황 (Airtable 설정 전). 설정을 마치면 아래 주석을 해제.
      <a href="participants.html" class="index-row">
        <span>
          <span class="label">참여자 현황</span>
          <span class="desc">현재 북클럽 참여자 명단과 진행 현황을 확인하세요.</span>
        </span>
        <span class="arrow">→</span>
      </a>
      -->
    </section>

    <footer>
      <span>온도교회 사명자반 북클럽</span>
      <a href="https://www.ondochurch.org/" target="_blank">온도교회 웹사이트 방문하기 →</a>
    </footer>

  </div>

</body>
</html>
